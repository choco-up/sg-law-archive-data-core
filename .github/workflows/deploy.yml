name: Deploy Datasette

on:
  workflow_dispatch:
    inputs:
      skip_build_db:
        description: Fast ECS deploy test (reuse latest ECR image, skip build)
        type: boolean
        default: false
  workflow_run:
    workflows: ["Obtain latest hearings data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  ECS_TASK_CPU: ${{ vars.ECS_TASK_CPU }}
  ECS_TASK_MEMORY: ${{ vars.ECS_TASK_MEMORY }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Check out this repo
        if: github.event_name != 'workflow_dispatch' || inputs.skip_build_db != true
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        if: github.event_name != 'workflow_dispatch' || inputs.skip_build_db != true

      - uses: cachix/cachix-action@v16
        if: github.event_name != 'workflow_dispatch' || inputs.skip_build_db != true
        with:
          name: devenv

      - name: Install devenv.sh
        if: github.event_name != 'workflow_dispatch' || inputs.skip_build_db != true
        run: nix profile install nixpkgs#devenv

      - name: Build Datasette database
        if: github.event_name != 'workflow_dispatch' || inputs.skip_build_db != true
        run: devenv shell build-db

      - name: Build frontend assets
        if: github.event_name != 'workflow_dispatch' || inputs.skip_build_db != true
        run: devenv shell build-frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        if: github.event_name != 'workflow_dispatch' || inputs.skip_build_db != true
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -f docker/prod.Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Use latest ECR image
        id: use-latest-ecr-image
        if: github.event_name == 'workflow_dispatch' && inputs.skip_build_db
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest \
            --region "$AWS_REGION"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --region "$AWS_REGION" > task-definition.json

      - name: Prepare task definition for the new image
        run: |
          jq \
            --arg container "$ECS_CONTAINER_NAME" \
            --arg cpu "$ECS_TASK_CPU" \
            --arg memory "$ECS_TASK_MEMORY" \
            'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | del(.containerDefinitions[] | select(.name == $container) | .command)
            | (.containerDefinitions[] | select(.name == $container) | .environment) = []
            | (.containerDefinitions[] | select(.name == $container) | .secrets) = []
            | if $cpu != "" then .cpu = $cpu else . end
            | if $memory != "" then .memory = $memory else . end' \
            task-definition.json > task-definition.clean.json
          mv task-definition.clean.json task-definition.json

      - name: Render task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image || steps.use-latest-ecr-image.outputs.image }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
